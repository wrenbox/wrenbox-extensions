<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Color blocks</title>
    <link rel="stylesheet" href="blocks.css" />
  </head>
  <body>
    <!-- 12 pure color blocks, 100×100 px each, in rows of 6 (see tests/e2e/colors.ts). -->
    <div class="b" style="left: 0; top: 0; background: rgb(255, 0, 0)"></div>
    <div class="b" style="left: 100px; top: 0; background: rgb(0, 255, 0)"></div>
    <div class="b" style="left: 200px; top: 0; background: rgb(0, 0, 255)"></div>
    <div class="b" style="left: 300px; top: 0; background: rgb(255, 255, 0)"></div>
    <div class="b" style="left: 400px; top: 0; background: rgb(0, 255, 255)"></div>
    <div class="b" style="left: 500px; top: 0; background: rgb(255, 0, 255)"></div>
    <div class="b" style="left: 0; top: 100px; background: rgb(255, 128, 0)"></div>
    <div class="b" style="left: 100px; top: 100px; background: rgb(128, 0, 255)"></div>
    <div class="b" style="left: 200px; top: 100px; background: rgb(128, 128, 128)"></div>
    <div class="b" style="left: 300px; top: 100px; background: rgb(214, 96, 145)"></div>
    <div class="b" style="left: 400px; top: 100px; background: rgb(61, 153, 0)"></div>
    <div class="b" style="left: 500px; top: 100px; background: rgb(107, 122, 46)"></div>
    <input id="field" type="text" aria-label="A text field" style="position: absolute; left: 700px; top: 20px" />
  </body>
</html>
