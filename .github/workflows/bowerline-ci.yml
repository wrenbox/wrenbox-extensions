# Runs Bowerline's full check suite on every change to it, and keeps the
# built zip as a downloadable artifact for a week.
name: Bowerline CI

on:
  push:
    branches: [main]
    paths:
      - 'extensions/bowerline/**'
      - '.github/workflows/bowerline-*.yml'
  pull_request:
    paths:
      - 'extensions/bowerline/**'
      - '.github/workflows/bowerline-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bowerline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/bowerline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/bowerline/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # typecheck, lint, unit tests, build, network + permission audits, e2e, zip
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: bowerline-zip
          path: extensions/bowerline/release/*.zip
          retention-days: 7
