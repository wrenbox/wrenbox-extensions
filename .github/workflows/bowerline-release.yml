# Publishes a Bowerline release. Push a tag named bowerline-v<version>
# (matching package.json); this builds the extension, runs the full verify
# suite and, only if everything passes, creates the GitHub Release with the
# Chrome Web Store zip attached.
name: Bowerline release

on:
  push:
    tags: ['bowerline-v*']

permissions:
  contents: write

concurrency:
  group: bowerline-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/bowerline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/bowerline/package-lock.json
      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "bowerline-v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected bowerline-v${VERSION})."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Write release notes
        run: node scripts/release-notes.mjs "${VERSION}" > "${RUNNER_TEMP}/notes.md"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "release/bowerline-${VERSION}.zip" \
            --title "Bowerline ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
